[project]
name = "tp544-assignment3-metasurface-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
    "scipy>=1.13,<2",
    "pytest>=8,<10",
    "torch>=2.5,<3",
]


[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metasurface"]
